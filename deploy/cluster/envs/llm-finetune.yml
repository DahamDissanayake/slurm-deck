# deploy/cluster/envs/llm-finetune.yml
# description: LoRA/QLoRA fine-tuning (transformers, peft, trl, bitsandbytes)
# Prebuilt conda environment, CUDA 12.8 / PyTorch 2.7 wheels (cu128).
# Fast-moving libraries carry an upper bound: unbounded pins broke jobs before.
# Built by the environments admin page into $NFS_ROOT/envs/llm-finetune.
name: llm-finetune
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - torch==2.7.*
    - torchvision
    - torchaudio
    - transformers>=4.40,<5
    - peft>=0.11
    - trl>=0.8,<1
    - bitsandbytes>=0.43
    - accelerate>=0.30
    - datasets>=2.19
    - safetensors
    - scipy
    - sentencepiece
    - protobuf
